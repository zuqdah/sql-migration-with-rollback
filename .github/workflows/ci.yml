name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.16.3"
  # sqlpackage targets .NET 8 and the runners carry 9. Rolling forward is
  # cheaper than installing a second runtime on every job.
  DOTNET_ROLL_FORWARD: Major

jobs:
  powershell:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tooling
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -MinimumVersion 1.22.0 -Force
          Import-Module PSScriptAnalyzer -ErrorAction Stop

      - name: Analyze
        shell: pwsh
        run: |
          # -Path takes one string, so each tree is analyzed on its own pass.
          $results = @()
          foreach ($tree in 'module', 'scripts') {
            $results += Invoke-ScriptAnalyzer -Path $tree -Recurse
          }
          # A test fixture legitimately declares parameters it never reads, so
          # that one rule is excluded for the test tree only.
          $results += Invoke-ScriptAnalyzer -Path tests -Recurse -ExcludeRule PSReviewUnusedParameter
          if ($results.Count) {
            $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message |
              Out-String -Width 200 | Write-Host
            throw "PSScriptAnalyzer reported $($results.Count) issue(s)."
          }
          Write-Host 'PSScriptAnalyzer is clean.'

      - name: Test
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'testResults.xml'
          Invoke-Pester -Configuration $config

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: testResults.xml
          if-no-files-found: warn

  roundtrip:
    name: Full migration against a real SQL Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The source is a throwaway container bound to this runner and reachable
      # from nowhere else. Its password is generated here so no credential
      # exists in the repository, even a disposable one.
      - name: Start the source database
        run: |
          SA_PASSWORD="$(openssl rand -base64 24 | tr -d /+= | head -c 24)aA1!"
          echo "::add-mask::$SA_PASSWORD"
          echo "SA_PASSWORD=$SA_PASSWORD" >> "$GITHUB_ENV"
          docker run -d --name srcsql \
            -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" -e MSSQL_PID=Developer \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 30); do
            if docker exec srcsql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server ready after $(( i * 5 ))s or less"
              exit 0
            fi
            sleep 5
          done
          echo "::error::SQL Server never became ready"
          docker logs srcsql | tail -40
          exit 1

      - name: Seed the source
        run: |
          docker cp source/01-schema.sql srcsql:/tmp/01.sql
          docker cp source/02-seed.sql   srcsql:/tmp/02.sql
          docker exec srcsql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -i /tmp/01.sql
          docker exec srcsql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -i /tmp/02.sql

      - name: Install tooling
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module SqlServer -Force -AllowClobber
          dotnet tool install -g microsoft.sqlpackage
          "$HOME/.dotnet/tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      # Everything the Azure deploy does, against a second database on the same
      # server. The pipeline logic is proven on every push without spending a
      # penny; the deploy then repeats it against Azure SQL.
      - name: Assess the source
        shell: pwsh
        run: |
          $secure = ConvertTo-SecureString $env:SA_PASSWORD -AsPlainText -Force
          $cred = [pscredential]::new('sa', $secure)
          ./scripts/Get-DatabaseFacts.ps1 -ServerInstance 'localhost,1433' -Database AppDb -Credential $cred -TrustServerCertificate -OutFile out/source-facts.json
          ./scripts/Invoke-Assessment.ps1 -FactsPath out/source-facts.json -OutFile out/assessment.json

      - name: Export the rollback artifact
        shell: pwsh
        run: |
          $secure = ConvertTo-SecureString $env:SA_PASSWORD -AsPlainText -Force
          $cred = [pscredential]::new('sa', $secure)
          ./scripts/Export-Bacpac.ps1 -ServerInstance 'localhost,1433' -Database AppDb -Credential $cred -TrustServerCertificate -OutFile out/AppDb.bacpac

      - name: Migrate and prove parity
        shell: pwsh
        run: |
          $secure = ConvertTo-SecureString $env:SA_PASSWORD -AsPlainText -Force
          $cred = [pscredential]::new('sa', $secure)
          ./scripts/Import-Bacpac.ps1 -ServerInstance 'localhost,1433' -Database AppDb_target -BacpacPath out/AppDb.bacpac -Credential $cred -TrustServerCertificate
          ./scripts/Get-DatabaseFacts.ps1 -ServerInstance 'localhost,1433' -Database AppDb_target -Credential $cred -TrustServerCertificate -OutFile out/target-facts.json
          ./scripts/Test-MigrationParity.ps1 -SourceFacts out/source-facts.json -TargetFacts out/target-facts.json -OutFile out/parity.json

      # A backup nobody has restored is a hope. This restores the artifact and
      # compares it against the pre-migration facts.
      - name: Rollback drill
        shell: pwsh
        run: |
          $secure = ConvertTo-SecureString $env:SA_PASSWORD -AsPlainText -Force
          $cred = [pscredential]::new('sa', $secure)
          ./scripts/Invoke-RollbackDrill.ps1 -ServerInstance 'localhost,1433' -BacpacPath out/AppDb.bacpac -SourceFacts out/source-facts.json -Credential $cred -TrustServerCertificate -OutFile out/rollback-parity.json

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path out/parity.json) {
            $p = Get-Content out/parity.json -Raw | ConvertFrom-Json
            $a = Get-Content out/assessment.json -Raw | ConvertFrom-Json
            "### Migration round trip"                                            | Out-File $env:GITHUB_STEP_SUMMARY -Append
            ""                                                                     | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "Assessment: **$($a.Blocking)** blocking, **$($a.Warning)** warnings."  | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "Parity: **$($p.RowsSource)** rows across **$($p.TablesSource)** tables, **$($p.Differences.Count)** differences." | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "The rollback artifact was restored and verified against the pre-migration source." | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: migration-evidence
          path: |
            out/source-facts.json
            out/target-facts.json
            out/assessment.json
            out/parity.json
            out/rollback-parity.json
          if-no-files-found: warn

  terraform:
    name: Terraform format, validate, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          for dir in bootstrap infra; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - uses: terraform-linters/setup-tflint@v6

      - name: Lint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

  security:
    name: Checkov policy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .checkov.yaml